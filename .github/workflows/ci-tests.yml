name: "CI - Tests"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
    - cron: "17 3 * * *"
    - cron: "17 3 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ steps.scope.outputs.benchmarks }}
      mutation: ${{ steps.scope.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select jobs for changed paths
        id: scope
        run: node --experimental-strip-types scripts/select-ci-scope.mts
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  source:
    timeout-minutes: 45
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Source Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  process:
    timeout-minutes: 25
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Process Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:process:source

  repro-journey:
    timeout-minutes: 30
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Repro Golden Journey (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Install pinned cue-shell runtime
        run: |
          cargo install \
            --git https://github.com/zendev-lab/cue.git \
            --rev 3d596c626f8a5c3fec02499ecc28094ed80aabc4 \
            --locked \
            --root "${RUNNER_TEMP}/cue-shell" \
            cue-cli
          echo "${RUNNER_TEMP}/cue-shell/bin" >> "${GITHUB_PATH}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:journey:repro

  browser:
    name: Browser Tests
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's ubuntu images already ship the Chromium system libraries, so
      # `playwright install` runs without --with-deps (no apt) and the browser
      # is cached natively through actions/cache — no per-run downloads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright chromium
        run: timeout 600 pnpm --filter @zendev-lab/spark-hub exec playwright install chromium
      - run: pnpm run test:browser
  rust:
    name: Rust Quality and Coverage
    if: (github.event_name != 'schedule' || github.event.schedule == '23 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      - name: Install pinned Rust checks
        run: |
          cargo install --locked cargo-machete --version 0.9.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-llvm-cov --version 0.6.21
      - run: cargo machete
      - run: cargo deny check advisories
      - run: cargo deny --manifest-path fuzz/Cargo.toml check advisories
      - name: Inventory dependency licenses
        run: |
          mkdir -p reports
          cargo deny list --format json > reports/rust-licenses.json
      - name: Test with coverage and preserve documentation tests
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/rust.lcov
          cargo test --workspace --doc --locked
      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/rust.lcov
          flags: rust
          use_oidc: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rust-coverage
          path: |
            coverage/rust.lcov
            reports/rust-licenses.json
          if-no-files-found: error

  typescript-coverage:
    name: TypeScript Coverage
    if: (github.event_name != 'schedule' || github.event.schedule == '23 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info,apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
          flags: typescript
          use_oidc: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: typescript-coverage
          path: |
            coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: error

  rust-reports:
    name: Rust Mutation and Fuzz
    if: >-
      ((github.event_name != 'schedule' || github.event.schedule == '23 4 * * 1')) && (github.event_name == 'schedule' || github.event_name
      == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
      - name: Install mutation and fuzz runners
        run: |
          cargo install --locked cargo-mutants --version 27.1.0
          cargo install --locked cargo-fuzz --version 0.13.2
          rustup toolchain install nightly-2026-10-26 --profile minimal
      - name: Mutate native state persistence
        run: |
          mkdir -p reports/rust-mutation
          cargo mutants --package spark-deployment --file 'packages/spark-deployment/native/src/state.rs' --jobs 2 --cargo-arg=--locked --output reports/rust-mutation
      - name: Fuzz persisted contracts with AddressSanitizer
        if: ${{ !cancelled() }}
        run: |
          cargo +nightly-2026-10-26 fetch --manifest-path fuzz/Cargo.toml --locked
          mkdir -p fuzz/corpus/deployment_state
          CARGO_NET_OFFLINE=true cargo +nightly-2026-10-26 fuzz run deployment_state fuzz/corpus/deployment_state fuzz/seeds/deployment_state -- -max_total_time=60 -max_len=4096
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rust-quality-reports
          path: |
            reports/rust-mutation
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: error

  select-walltime:
    name: Select I/O Benchmarks
    if: >-
      (github.event_name != 'pull_request' || needs.scope.outputs.benchmarks == 'true') && (github.event_name != 'schedule' || github.event.schedule
      == '17 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.select.outputs.files }}
      has_benchmarks: ${{ steps.select.outputs.has_benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select relevant benchmarks
        id: select
        run: node --experimental-strip-types scripts/select-benchmark-files.mts
        env:
          BENCHMARK_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          BENCHMARK_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before
            || '' }}
          BENCHMARK_LANE: walltime

    needs:
      - scope
  cpu-benchmarks:
    name: CPU Benchmarks
    if: >-
      (github.event_name != 'pull_request' || needs.scope.outputs.benchmarks == 'true') && (github.event_name != 'schedule' || github.event.schedule
      == '17 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select relevant benchmarks
        id: select
        run: node --experimental-strip-types scripts/select-benchmark-files.mts
        env:
          BENCHMARK_ALL:
            ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name ==
            'workflow_dispatch' }}
          BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          BENCHMARK_LANE: simulation
      - name: Run CodSpeed benchmarks
        if: steps.select.outputs.has_benchmarks == 'true'
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: pnpm run bench:codspeed:selected
        env:
          BENCHMARK_LANE: simulation
          SPARK_BENCHMARK_FILES: ${{ steps.select.outputs.files }}

    needs:
      - scope
  io-benchmarks:
    name: I/O Benchmarks
    if: >-
      ((github.event_name != 'pull_request' || needs.scope.outputs.benchmarks == 'true') && (github.event_name != 'schedule' || github.event.schedule
      == '17 3 * * *')) && (needs.select-walltime.outputs.has_benchmarks == 'true')
    needs:
      - select-walltime
      - scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Node.js runtime
        id: node-runtime
        shell: bash
        run: |
          version="$(tr -d '\r\n' < .node-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.node-version::.node-version must contain an exact semver"
            exit 1
          fi
          printf 'spec=node@%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: ${{ steps.node-runtime.outputs.spec }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: pnpm run bench:codspeed:selected
        env:
          BENCHMARK_LANE: walltime
          SPARK_BENCHMARK_FILES: ${{ needs.select-walltime.outputs.files }}
  focused-mutation:
    name: Focused Mutation Tests
    if: >-
      github.event_name != 'merge_group' && github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      && (github.event_name != 'pull_request' || github.base_ref == 'main') && (github.event_name != 'pull_request' || needs.scope.outputs.mutation
      == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run focused mutation tests
        run: >-
          pnpm --workspace-concurrency=1
          --filter @zendev-lab/spark-daemon
          --filter @zendev-lab/spark-tasks
          run test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ci-reports
          path: |
            apps/*/reports/mutation/
            packages/*/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
    needs: scope
  mutation-tests:
    name: Mutation Tests
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' && (github.event_name
      != 'schedule' || github.event.schedule == '17 3 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run full mutation CE
        run: pnpm run test:mutation

      - name: Upload mutation CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-ce-reports
          path: packages/*/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
