name: "CI - Static Checks"

on:
  pull_request:
  merge_group:
    types:
      - checks_requested

  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
    - cron: "17 4 * * 2"
    - cron: "37 2 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select jobs for changed paths
        id: scope
        run: node --experimental-strip-types scripts/select-ci-scope.mts
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  pre-commit:
    timeout-minutes: 20
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prek run --all-files --skip spark-source-check

  project:
    timeout-minutes: 30
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Project Checks
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check architecture transition from main
        run: pnpm run check:architecture-transition -- --base-ref origin/main
      - run: pnpm run check:static

  documentation:
    timeout-minutes: 15
    if: github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Documentation Checks
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:docs
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: (github.event_name != 'schedule' || github.event.schedule == '23 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              # Deliberately unsafe rule fixtures, verified by semgrep --test.
              - quality/semgrep/**
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  workflow-audit:
    name: Online Workflow Audit
    if: >-
      ((github.event_name != 'schedule' || github.event.schedule == '23 4 * * 1')) && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Audit action provenance and references
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          uvx --with shellcheck-py==0.11.0.1 --with pyflakes==3.4.0 jactionlint==2.3.0 --online=strict
          --online-report=workflow-audit.json --shellcheck=shellcheck --pyflakes=pyflakes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: workflow-audit
          path: workflow-audit.json
          if-no-files-found: error
  hygiene-reports:
    name: Hygiene Reports
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' && (github.event_name
      != 'schedule' || github.event.schedule == '17 4 * * 2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate hygiene reports
        run: pnpm run report:hygiene
      - name: Inventory JavaScript dependency licenses
        run: pnpm licenses list --json > reports/javascript-licenses.json

      - name: Upload hygiene CE reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hygiene-ce-reports
          path: |
            reports/knip-report.json
            reports/knip-console.txt
            reports/jscpd/
            reports/complexity.txt
            reports/javascript-licenses.json
          if-no-files-found: ignore
          retention-days: 14

  links:
    name: External Documentation Links
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' && (github.event_name
      != 'schedule' || github.event.schedule == '17 4 * * 2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Check active documentation links
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(["git", "ls-files", "-z", "*.md"]).decode().split("\0")
          # Archived documentation retains its historical references.
          files = [path for path in files if path and "/docs/0.2/" not in path and "/docs/zh/0.2/" not in path]
          command = ["uvx", "--from", "lychee-bin==0.24.2", "lychee", "--scheme", "https", "--scheme", "http", "--no-progress", "--root-dir", str(Path("apps/spark-docs/src/content/docs").resolve()), "--timeout", "20", "--max-retries", "1", "--format", "json", "--output", "links.json", "--"]
          raise SystemExit(subprocess.call(command + files))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: external-documentation-links
          path: links.json
          if-no-files-found: error
  pull-request-dependencies:
    timeout-minutes: 15
    if: >-
      ((github.event_name != 'push' || needs.scope.outputs.dependencies == 'true') && (github.event_name != 'schedule' || github.event.schedule
      == '37 2 * * 1')) && (github.event_name == 'pull_request')
    name: New Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Inline of osv-scanner-reusable-pr.yml so the check stays two levels.
      - name: Checkout target branch
        run: git checkout "$GITHUB_BASE_REF"

      - name: Run scanner on existing code
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --lockfile=pnpm-lock.yaml
            --lockfile=Cargo.lock

      - name: Checkout current branch
        run: git checkout -f "$GITHUB_SHA"

      - name: Run scanner on new code
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --lockfile=pnpm-lock.yaml
            --lockfile=Cargo.lock

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

    needs: scope
    permissions:
      actions: read
      contents: read

  complete-dependencies:
    timeout-minutes: 20
    if: >-
      ((github.event_name != 'push' || needs.scope.outputs.dependencies == 'true') && (github.event_name != 'schedule' || github.event.schedule
      == '37 2 * * 1')) && (github.event_name != 'pull_request')
    name: Complete Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inline of osv-scanner-reusable.yml so the check stays two levels.
      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=pnpm-lock.yaml
            --lockfile=Cargo.lock

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload artifact
        id: upload_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      - name: Print code scanning URL
        if: ${{ !cancelled() }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "View the OSV-Scanner results in the 'Security' tab, using the following link:"
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}+tool%3Aosv-scanner"

      - name: Error troubleshooter
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by an error during scanning earlier in the workflow."
          exit 1
    needs: scope
